[project]
name = "ptcg-transformer-ppo"
version = "0.1.0"
description = "Minimal C++ arena, GBDT, Transformer distillation, and PPO pipeline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=2.2.0",
    "kaggle>=2.2.4",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/engine/cg"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
    "D100", "D101", "D102", "D103", "D105", "D107",
]
# CLI scripts add the repository source directory before importing agents.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Preserve the official policies' comparison semantics for cg API objects.
"src/agents/*/main.py" = ["E711"]
